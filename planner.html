<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Planner - StudySmart</title>

    <link rel="stylesheet"
          href="planner.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <h3>
        🎓 StudySmart
    </h3>

    <h3>
        Hello, Buddy 👋
    </h3>

</header>


<!-- ================= MAIN ================= -->

<section class="main">


    <!-- ================= CREATE PLAN ================= -->

    <div class="card">

        <h3>
            📚 Create Study Plan
        </h3>


        <div class="illustration-box">

            <img
                src="images/study-planner.png"
                alt="Study Planner">

        </div>


        <!-- CLASS -->

        <label>
            Class 👩‍🏫
        </label>

        <select id="class">

            <option>8th</option>
            <option>9th</option>
            <option>10th</option>
            <option>11th</option>
            <option>12th</option>
            <option>Engineering</option>
            <option>MBBS</option>
            <option>Others</option>

        </select>


        <!-- SUBJECT -->

        <label>
            Subject 📙
        </label>

        <input
            type="text"
            id="subject"
            placeholder="e.g. Physics">


        <!-- TOPIC -->

        <label>
            Topic 📖
        </label>

        <input
            type="text"
            id="topic"
            placeholder="e.g. Thermodynamics">


        <!-- PDF -->

        <label>
            Upload PDF (Optional) 📄
        </label>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf">


        <!-- HOURS -->

        <label>
            Hours per day 🕘
        </label>

        <select id="hours">

            <option value="1">1 hour</option>
            <option value="2">2 hours</option>
            <option value="3">3 hours</option>
            <option value="4">4 hours</option>
            <option value="5">5 hours</option>
            <option value="6">6 hours</option>
            <option value="7">7 hours</option>
            <option value="8">8 hours</option>
            <option value="9">9 hours</option>
            <option value="10">10 hours</option>
            <option value="11">11 hours</option>
            <option value="12">12 hours</option>
            <option value="13">13 hours</option>
            <option value="14">14 hours</option>

        </select>


        <!-- DAYS -->

        <label>
            Number of Days 📆
        </label>

        <input
            type="number"
            id="days"
            placeholder="e.g. 7">


        <!-- BUTTON -->

        <button onclick="generatePlan()">

            ✨ Generate Smart Plan ✨

        </button>

    </div>


    <!-- ================= OUTPUT ================= -->

    <div class="card big">

        <h3>
            Your Personalized Study Plan
        </h3>


        <div
            id="output"
            class="output-box">

            Your plan will appear here...

        </div>

    </div>


</section>


<script src="planner.js"></script>

</body>

</html>
