<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Notes - StudySmart</title>

    <link rel="stylesheet"
          href="notes.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        <h3>
            🎓 StudySmart Notes
        </h3>

    </div>


    <div class="user-greeting">

        <h3>
            Hello, Buddy 👋
        </h3>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="main-container">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar-card">


        <div class="illustration-box">

            <img
                src="images/ai-notes.png"
                alt="AI Notes">

        </div>


        <!-- SUBJECT -->

        <div class="input-group">

            <label>
                SUBJECT 📕
            </label>

            <input
                type="text"
                id="subject"
                placeholder="e.g., Computer Science">

        </div>


        <!-- TOPIC -->

        <div class="input-group">

            <label>
                TOPIC 📖
            </label>

            <input
                type="text"
                id="topic"
                placeholder="e.g., Data Structures">

        </div>


        <!-- FILE -->

        <div class="input-group">

            <label>
                UPLOAD SOURCE (PDF/TXT) 📄
            </label>

            <div class="file-upload">

                <input
                    type="file"
                    id="notesSource"
                    accept=".pdf,.txt">

            </div>

        </div>


        <!-- BUTTON -->

        <button
            class="generate-btn"
            onclick="generateNotes()">

            ✨ Generate Smart Notes ✨

        </button>


    </aside>


    <!-- ================= OUTPUT ================= -->

    <section class="content-card">

        <h3>
            Your Personalized Study Notes
        </h3>


        <div
            id="notes-output"
            class="output-display">

            <p class="placeholder-text">

                Your professional notes will
                appear here once generated...

            </p>

        </div>

    </section>


</main>


<script src="notes.js"></script>

</body>

</html>
